name: Empaquetar JS VOICE APK v1.2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/empaquetar-apk.yml'
jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar JS VOICE v1.2
        run: |
          curl --fail --location --retry 5 --output JS-VOICE-v1.2.0-Universal.apk 'https://github.com/angel738284-ui/js-voice-apk/releases/download/v1.2.0/JS-VOICE-v1.2.0-Universal.apk'
          test "$(stat -c%s JS-VOICE-v1.2.0-Universal.apk)" -eq 27597057
      - uses: actions/upload-artifact@v4
        with:
          name: JS-VOICE-v1.2-ChatGPT
          path: JS-VOICE-v1.2.0-Universal.apk
          retention-days: 7

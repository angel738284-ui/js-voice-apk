name: JS VOICE v1.8 in-chat package
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/empaquetar-apk.yml'
jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK v1.8
        run: |
          curl --fail --location --retry 5 --output JS-VOICE-v1.8.0-Google-Beta.apk 'https://github.com/angel738284-ui/js-voice-apk/releases/download/v1.8.0/JS-VOICE-v1.8.0-Google-Beta.apk'
          test "$(stat -c%s JS-VOICE-v1.8.0-Google-Beta.apk)" -eq 30128811
      - uses: actions/upload-artifact@v4
        with:
          name: JS-VOICE-v1.8-ChatGPT
          path: JS-VOICE-v1.8.0-Google-Beta.apk
          retention-days: 7

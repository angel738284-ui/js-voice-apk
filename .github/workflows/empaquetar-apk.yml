name: JS VOICE v1.4 en el chat
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/empaquetar-apk.yml'
jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK v1.4
        run: |
          curl --fail --location --retry 5 --output JS-VOICE-v1.4.0-Universal.apk 'https://github.com/angel738284-ui/js-voice-apk/releases/download/v1.4.0/JS-VOICE-v1.4.0-Universal.apk'
          test "$(stat -c%s JS-VOICE-v1.4.0-Universal.apk)" -eq 27613441
      - uses: actions/upload-artifact@v4
        with:
          name: JS-VOICE-v1.4-ChatGPT
          path: JS-VOICE-v1.4.0-Universal.apk
          retention-days: 7
